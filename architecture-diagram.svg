<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Inter, sans-serif">

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- DEFS — arrowhead marker                                        -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrow-down" markerWidth="8" markerHeight="8" refX="3" refY="6" orient="auto">
      <path d="M0,0 L6,0 L3,8 z" fill="#3B82F6"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- NODE 1 — React 19 + Vite Frontend (leftmost)                  -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g id="node-client">
    <rect x="20" y="100" width="195" height="300" rx="8" ry="8"
          fill="#0F1520" stroke="#2A3A52" stroke-width="1"/>
    <!-- header accent -->
    <rect x="20" y="100" width="195" height="4" rx="8" ry="8" fill="#3B82F6"/>

    <!-- Icon row -->
    <text x="117" y="145" text-anchor="middle" font-size="28">⚛️</text>

    <!-- Title -->
    <text x="117" y="172" text-anchor="middle"
          font-size="13" font-weight="700" fill="#FFFFFF">React 19 + Vite</text>
    <text x="117" y="188" text-anchor="middle"
          font-size="11" fill="#3B82F6">Frontend (SPA)</text>

    <!-- Divider -->
    <line x1="36" y1="198" x2="199" y2="198" stroke="#2A3A52" stroke-width="1"/>

    <!-- Feature list -->
    <text x="36" y="218" font-size="10.5" fill="#E5E7EB">📄 Pages</text>
    <text x="52" y="233" font-size="9.5" fill="#94A3B8">Login / Home / Profile</text>
    <text x="52" y="248" font-size="9.5" fill="#94A3B8">Demo / Groups / Friends</text>

    <text x="36" y="267" font-size="10.5" fill="#E5E7EB">🧩 Components</text>
    <text x="52" y="282" font-size="9.5" fill="#94A3B8">Chatbox, Sidebar</text>
    <text x="52" y="297" font-size="9.5" fill="#94A3B8">CallingInterface (WebRTC)</text>
    <text x="52" y="312" font-size="9.5" fill="#94A3B8">VoiceCall / CallerWindow</text>

    <text x="36" y="331" font-size="10.5" fill="#E5E7EB">🌐 Deployed on</text>
    <text x="52" y="346" font-size="9.5" fill="#94A3B8">Vercel (talklet.app)</text>

    <text x="36" y="365" font-size="10.5" fill="#E5E7EB">📦 Stack</text>
    <text x="52" y="380" font-size="9.5" fill="#94A3B8">TailwindCSS · Bootstrap</text>
    <text x="52" y="395" font-size="9.5" fill="#94A3B8">React Router v7</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ARROW 1→2  HTTP REST + Socket.io (bidirectional)              -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- top arrow: REST/HTTP -->
  <line x1="215" y1="220" x2="290" y2="220"
        stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="252" y="214" text-anchor="middle" font-size="9" fill="#3B82F6">REST/HTTPS</text>

  <!-- bottom arrow: Socket.io bidirectional -->
  <line x1="290" y1="280" x2="215" y2="280"
        stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="215" y1="295" x2="290" y2="295"
        stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="252" y="272" text-anchor="middle" font-size="9" fill="#3B82F6">Socket.io</text>
  <text x="252" y="312" text-anchor="middle" font-size="8.5" fill="#94A3B8">(real-time)</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- NODE 2 — Express + Socket.io Backend                          -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g id="node-backend">
    <rect x="290" y="60" width="210" height="380" rx="8" ry="8"
          fill="#0F1520" stroke="#2A3A52" stroke-width="1"/>
    <rect x="290" y="60" width="210" height="4" rx="8" ry="8" fill="#3B82F6"/>

    <text x="395" y="105" text-anchor="middle" font-size="26">🖥️</text>
    <text x="395" y="132" text-anchor="middle"
          font-size="13" font-weight="700" fill="#FFFFFF">Express 5 + Socket.io</text>
    <text x="395" y="148" text-anchor="middle"
          font-size="11" fill="#3B82F6">Node.js Backend (Vercel)</text>

    <line x1="306" y1="158" x2="484" y2="158" stroke="#2A3A52" stroke-width="1"/>

    <!-- Routes -->
    <text x="306" y="178" font-size="10.5" fill="#E5E7EB">🔀 API Routes</text>
    <text x="322" y="193" font-size="9.5" fill="#94A3B8">/api/auth · /api/users</text>
    <text x="322" y="208" font-size="9.5" fill="#94A3B8">/api/messages</text>
    <text x="322" y="223" font-size="9.5" fill="#94A3B8">/api/friends · /api/groups</text>
    <text x="322" y="238" font-size="9.5" fill="#94A3B8">/api/demo</text>

    <!-- Middleware -->
    <text x="306" y="258" font-size="10.5" fill="#E5E7EB">🔒 Middleware</text>
    <text x="322" y="273" font-size="9.5" fill="#94A3B8">protectRoute (JWT verify)</text>
    <text x="322" y="288" font-size="9.5" fill="#94A3B8">DemoSession guard</text>
    <text x="322" y="303" font-size="9.5" fill="#94A3B8">bcryptjs password hash</text>

    <!-- Socket events -->
    <text x="306" y="323" font-size="10.5" fill="#E5E7EB">⚡ Socket Events</text>
    <text x="322" y="338" font-size="9.5" fill="#94A3B8">typing / stop_typing</text>
    <text x="322" y="353" font-size="9.5" fill="#94A3B8">newMessage</text>
    <text x="322" y="368" font-size="9.5" fill="#94A3B8">call_initiate/answer/ice</text>
    <text x="322" y="383" font-size="9.5" fill="#94A3B8">getOnlineUsers</text>

    <!-- Scheduled tasks -->
    <text x="306" y="403" font-size="10.5" fill="#E5E7EB">⏰ Scheduled Cleanup</text>
    <text x="322" y="418" font-size="9.5" fill="#94A3B8">Messages: daily (30d old)</text>
    <text x="322" y="433" font-size="9.5" fill="#94A3B8">Demo sessions: 30min</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ARROW 2→3  Mongoose queries                                    -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <line x1="500" y1="250" x2="575" y2="250"
        stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="265" x2="500" y2="265"
        stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="537" y="244" text-anchor="middle" font-size="9" fill="#3B82F6">Mongoose ODM</text>
  <text x="537" y="281" text-anchor="middle" font-size="8.5" fill="#94A3B8">queries / docs</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- NODE 3 — MongoDB Atlas                                         -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g id="node-db">
    <rect x="575" y="100" width="195" height="300" rx="8" ry="8"
          fill="#0F1520" stroke="#2A3A52" stroke-width="1"/>
    <rect x="575" y="100" width="195" height="4" rx="8" ry="8" fill="#3B82F6"/>

    <text x="672" y="145" text-anchor="middle" font-size="28">🍃</text>
    <text x="672" y="172" text-anchor="middle"
          font-size="13" font-weight="700" fill="#FFFFFF">MongoDB Atlas</text>
    <text x="672" y="188" text-anchor="middle"
          font-size="11" fill="#3B82F6">Mongoose 8 ODM</text>

    <line x1="591" y1="198" x2="754" y2="198" stroke="#2A3A52" stroke-width="1"/>

    <text x="591" y="218" font-size="10.5" fill="#E5E7EB">📋 Collections</text>

    <text x="607" y="236" font-size="9.5" fill="#94A3B8">👤 users</text>
    <text x="623" y="251" font-size="8.5" fill="#64748B">fullName · email · passwordHash</text>
    <text x="623" y="265" font-size="8.5" fill="#64748B">profilePic · bio · isBot · isDemo</text>

    <text x="607" y="283" font-size="9.5" fill="#94A3B8">💬 messages</text>
    <text x="623" y="298" font-size="8.5" fill="#64748B">senderId · receiverId · text</text>
    <text x="623" y="312" font-size="8.5" fill="#64748B">image · audio · seen · demoSessionId</text>

    <text x="607" y="330" font-size="9.5" fill="#94A3B8">🤝 friendrequests</text>
    <text x="623" y="345" font-size="8.5" fill="#64748B">senderId · receiverId · status</text>

    <text x="607" y="363" font-size="9.5" fill="#94A3B8">👥 groups</text>
    <text x="623" y="378" font-size="8.5" fill="#64748B">name · members[]</text>

    <text x="607" y="396" font-size="9.5" fill="#94A3B8">🎭 demosessions</text>
    <text x="623" y="411" font-size="8.5" fill="#64748B">peerIds · expiresAt · status</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ARROW 2→4  Cloudinary upload (angled up-right from backend)   -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <line x1="500" y1="150" x2="770" y2="80"
        stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="630" y="100" text-anchor="middle" font-size="9" fill="#3B82F6">upload (image/audio)</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- NODE 4 — Cloudinary (top-right)                               -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g id="node-cloudinary">
    <rect x="770" y="20" width="195" height="170" rx="8" ry="8"
          fill="#0F1520" stroke="#2A3A52" stroke-width="1"/>
    <rect x="770" y="20" width="195" height="4" rx="8" ry="8" fill="#3B82F6"/>

    <text x="867" y="60" text-anchor="middle" font-size="22">☁️</text>
    <text x="867" y="82" text-anchor="middle"
          font-size="13" font-weight="700" fill="#FFFFFF">Cloudinary</text>
    <text x="867" y="97" text-anchor="middle"
          font-size="11" fill="#3B82F6">Media Storage (CDN)</text>

    <line x1="786" y1="107" x2="949" y2="107" stroke="#2A3A52" stroke-width="1"/>

    <text x="786" y="127" font-size="9.5" fill="#94A3B8">• Profile pictures (base64 → URL)</text>
    <text x="786" y="143" font-size="9.5" fill="#94A3B8">• Chat images (4 MB limit)</text>
    <text x="786" y="159" font-size="9.5" fill="#94A3B8">• Voice notes (resource_type: video)</text>
    <text x="786" y="175" font-size="9.5" fill="#94A3B8">• Background/banner images</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- ARROW 2→5  Gemini API call (angled down-right from backend)   -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <line x1="500" y1="350" x2="770" y2="380"
        stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="630" y="390" text-anchor="middle" font-size="9" fill="#3B82F6">generateContent (axios)</text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- NODE 5 — Gemini AI + Fallback (bottom-right)                  -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g id="node-ai">
    <rect x="770" y="310" width="195" height="170" rx="8" ry="8"
          fill="#0F1520" stroke="#2A3A52" stroke-width="1"/>
    <rect x="770" y="310" width="195" height="4" rx="8" ry="8" fill="#3B82F6"/>

    <text x="867" y="350" text-anchor="middle" font-size="22">🤖</text>
    <text x="867" y="372" text-anchor="middle"
          font-size="13" font-weight="700" fill="#FFFFFF">Bumble Bee AI</text>
    <text x="867" y="387" text-anchor="middle"
          font-size="11" fill="#3B82F6">Gemini 1.5 Flash</text>

    <line x1="786" y1="397" x2="949" y2="397" stroke="#2A3A52" stroke-width="1"/>

    <text x="786" y="417" font-size="9.5" fill="#94A3B8">• Primary: Gemini 1.5 Flash API</text>
    <text x="786" y="433" font-size="9.5" fill="#94A3B8">• Fallback: local keyword rules</text>
    <text x="786" y="449" font-size="9.5" fill="#94A3B8">• Web search: DuckDuckGo + Wiki</text>
    <text x="786" y="465" font-size="9.5" fill="#94A3B8">• Demo: rate-limited (20 req cap)</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- NODE 6 — Demo Mode callout (floating label)                   -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g id="node-demo">
    <rect x="980" y="155" width="200" height="190" rx="8" ry="8"
          fill="#0F1520" stroke="#2A3A52" stroke-width="1"/>
    <rect x="980" y="155" width="200" height="4" rx="8" ry="8" fill="#3B82F6"/>

    <text x="1080" y="193" text-anchor="middle" font-size="22">🎭</text>
    <text x="1080" y="215" text-anchor="middle"
          font-size="13" font-weight="700" fill="#FFFFFF">Demo Mode</text>
    <text x="1080" y="230" text-anchor="middle"
          font-size="11" fill="#3B82F6">Ephemeral Sessions</text>

    <line x1="996" y1="240" x2="1164" y2="240" stroke="#2A3A52" stroke-width="1"/>

    <text x="996" y="260" font-size="9.5" fill="#94A3B8">• No signup required</text>
    <text x="996" y="276" font-size="9.5" fill="#94A3B8">• Fake peer contacts + replies</text>
    <text x="996" y="292" font-size="9.5" fill="#94A3B8">• Bumble Bee bot (20 req cap)</text>
    <text x="996" y="308" font-size="9.5" fill="#94A3B8">• DemoSession expires + auto-purge</text>
    <text x="996" y="324" font-size="9.5" fill="#94A3B8">• Data isolated to session ID</text>
    <text x="996" y="340" font-size="9.5" fill="#94A3B8">• JWT isDemo flag enforced</text>
  </g>

  <!-- ARROW backend → demo mode -->
  <line x1="500" y1="250" x2="980" y2="250"
        stroke="#3B82F6" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- TITLE BANNER at top                                            -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <text x="600" y="30" text-anchor="middle"
        font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">
    Talklet — Architecture Overview
  </text>
  <text x="600" y="48" text-anchor="middle"
        font-size="11" fill="#94A3B8">
    React 19 SPA · Express 5 · MongoDB Atlas · Socket.io · Cloudinary · Gemini 1.5 Flash
  </text>

  <!-- ══════════════════════════════════════════════════════════════ -->
  <!-- LEGEND bottom-left                                             -->
  <!-- ══════════════════════════════════════════════════════════════ -->
  <g id="legend" transform="translate(20, 415)">
    <line x1="0" y1="10" x2="30" y2="10" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="36" y="14" font-size="9" fill="#94A3B8">REST / Socket.io</text>

    <line x1="130" y1="10" x2="160" y2="10" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="166" y="14" font-size="9" fill="#94A3B8">External service call</text>
  </g>

</svg>
